<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nana'kaJobe Catering & Baking</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: GitHub Pages has no server-side
      // rewrites, so a deep link like /gallery 404s here. Encode the real
      // path into a query string and redirect to index.html, which decodes
      // it back via history.replaceState before the router boots.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
